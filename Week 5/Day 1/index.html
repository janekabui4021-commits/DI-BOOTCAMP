<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Star Wars Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">Galactic character archive</p>
    <h1 class="star-wars-title">STAR WARS</h1>

    <section class="card" aria-labelledby="card-title">
      <div class="card-header">
        <span class="signal"><span></span> Live connection</span>
        <span class="card-id">SWAPI / 001</span>
      </div>
      <div id="content">
        <p class="instruction" id="card-title">Click the button to find a random character!</p>
      </div>
      <button id="find-btn" type="button">
        <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
        Find Someone
      </button>
    </section>
  </main>

  <script src="Star wars web usung Ajax Api.js"></script>
</body>
</html>
