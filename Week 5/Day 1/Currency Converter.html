<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <link rel="stylesheet" href="currency-converter.css">
</head>
<body>
  <main class="converter-card">
    <p class="eyebrow">Live exchange rates</p>
    <h1>Currency Converter</h1>

    <div class="form-group">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="1" min="0" step="any">
    </div>

    <div class="currency-selectors">
      <div class="form-group">
        <label for="from-currency">From</label>
        <select id="from-currency" aria-label="From currency"></select>
      </div>

      <button id="switch-btn" type="button" title="Switch currencies" aria-label="Switch currencies">⇄</button>

      <div class="form-group">
        <label for="to-currency">To</label>
        <select id="to-currency" aria-label="To currency"></select>
      </div>
    </div>

    <button id="convert-btn" type="button">Convert</button>
    <p id="result" class="result-box" aria-live="polite"></p>
  </main>

  <script src="Daily challenge currency converter.js"></script>
</body>
</html>
