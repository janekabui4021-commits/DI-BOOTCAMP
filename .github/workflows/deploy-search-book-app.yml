name: Deploy Search Book App

on:
  push:
    branches:
      - main
    paths:
      - 'week 14/day 7/Search book app/**'
      - '.github/workflows/deploy-search-book-app.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'week 14/day 7/Search book app/package-lock.json'

      - name: Install dependencies
        working-directory: week 14/day 7/Search book app
        run: npm ci

      - name: Build app
        working-directory: week 14/day 7/Search book app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the app at the repository's Pages root.
          path: 'week 14/day 7/Search book app/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
