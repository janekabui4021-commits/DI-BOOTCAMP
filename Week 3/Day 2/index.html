<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Solar System</title>
    <style>
      body {
        background-color: black;
        padding: 20px;
        font-family: Arial, sans-serif;
      }

      .listPlanets {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 20px;
        min-height: 100vh;
      }

      .planet {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        text-align: center;
        padding: 10px;
        position: relative;
        border: 2px solid white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .moon {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgb(237, 237, 237);
        border: 2px solid #d0d0d0;
      }
    </style>
  </head>
  <body>
    <section class="listPlanets"></section>

    <script src="./Daily challenge planets.js"></script>
  </body>
</html>
