<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise XP Gold</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      line-height: 1.6;
    }

    section {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      max-width: 600px;
    }

    select, input, button {
      padding: 8px 10px;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <section>
    <h2>Exercise 1: Select a kind of Music</h2>
    <select id="genres">
      <option value="rock">Rock</option>
      <option value="blues" selected>Blues</option>
    </select>
  </section>

  <section>
    <h2>Exercise 2: Delete colors</h2>
    <form>
      <select id="colorSelect">
        <option>Red</option>
        <option>Green</option>
        <option>White</option>
        <option>Black</option>
      </select>
      <input type="button" value="Select and Remove" />
    </form>
  </section>

  <section>
    <h2>Exercise 3: Create a shopping list</h2>
    <div id="root"></div>
  </section>

  <script src="Exercise XP Gold.js"></script>
</body>
</html>
