<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mad Libs</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    form {
      display: inline-block;
    }

    label {
      display: inline-block;
      width: 120px;
      margin: 8px 0;
    }

    input {
      padding: 6px 8px;
      margin: 4px 0;
    }

    button {
      margin-top: 10px;
      padding: 8px 14px;
      cursor: pointer;
    }

    #story {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Mad Libs</h1>

  <form id="libform">
    <label for="noun">Noun:</label>
    <input type="text" id="noun" /><br>

    <label for="adjective">Adjective:</label>
    <input type="text" id="adjective" /><br>

    <label for="person">Someone's Name:</label>
    <input type="text" id="person" /><br>

    <label for="verb">Verb:</label>
    <input type="text" id="verb" /><br>

    <label for="place">A place:</label>
    <input type="text" id="place" /><br>

    <button id="lib-button" type="submit">Lib it!</button>
    <button id="shuffle-button" type="button">Shuffle</button>
  </form>

  <p>Generated story:
    <span id="story"></span>
  </p>

  <script src="Daily challenge tell story.js"></script>
</body>
</html>
