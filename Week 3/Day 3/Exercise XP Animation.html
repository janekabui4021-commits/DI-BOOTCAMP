<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise XP Animation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    .exercise {
      margin-bottom: 40px;
    }

    #timerContainer {
      min-height: 40px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      padding: 10px;
    }

    #timerContainer p {
      background: yellow;
      color: red;
      padding: 5px;
      margin: 5px 0;
    }

    #moveContainer {
      width: 400px;
      height: 400px;
      position: relative;
      background: yellow;
      border: 1px solid #999;
    }

    #animate {
      width: 50px;
      height: 50px;
      position: absolute;
      background-color: red;
      left: 0;
      top: 0;
    }
  </style>
</head>
<body>
  <div class="exercise">
    <h2>Exercise 1: Timer</h2>
    <div id="timerContainer"></div>
    <button id="clear">Clear Interval</button>
  </div>

  <div class="exercise">
    <h2>Exercise 2: Move the box</h2>
    <button onclick="myMove()">Click Me</button>
    <div id="moveContainer">
      <div id="animate"></div>
    </div>
  </div>

  <script src="Exercise XP Animation.js"></script>
</body>
</html>
