<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double slider Sign in / Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: Grid;
      place-items:  center;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
    }

    .container {
      position: relative;
      width: 900px;
      max-width: 95vw;
      min-height: 550px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .form-container {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.7s ease-in-out;
    }

    .sign-in-container {
      left: 0;
      z-index: 2;
    }

    .sign-up-container {
      left: 0;
      opacity: 0;
      z-index: 1;
    }

    .container.right-panel-active .sign-in-container {
      transform: translateX(100%);
      opacity: 0;
    }

    .container.right-panel-active .sign-up-container {
      transform: translateX(100%);
      opacity: 1;
      z-index: 5;
    }

    form {
      width: 100%;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .social-container {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .social-container a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid #ddd;
      border-radius: 50%;
      color: #333;
      text-decoration: none;
      font-weight: bold;
    }

    input {
      width: 100%;
      background: #f3f3f3;
      border: none;
      padding: 14px 16px;
      border-radius: 8px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: #fff;
      padding: 14px 36px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: scale(1.03);
    }

    a {
      color: #333;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .overlay-container {
      position: absolute;
      top: 0;
      left: 50%;
      width: 50%;
      height: 100%;
      overflow: hidden;
      transition: transform 0.7s ease-in-out;
      z-index: 100;
    }

    .container.right-panel-active .overlay-container {
      transform: translateX(-100%);
    }

    .overlay {
      position: relative;
      width: 200%;
      height: 100%;
      left: -100%;
      background: linear-gradient(135deg, #ff4b2b, #ff416c);
      color: #fff;
      display: flex;
      transition: transform 0.7s ease-in-out;
    }

    .container.right-panel-active .overlay {
      transform: translateX(50%);
    }

    .overlay-panel {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 40px;
    }

    .overlay-panel h2 {
      margin-bottom: 16px;
      font-size: 2rem;
    }

    .overlay-panel p {
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .ghost {
      background: white;
      border: 1px solid #fff;
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="form-container sign-up-container">
      <form action="#">
        <h1>Create Account</h1>
        <div class="social-container">
          <a href="#">f</a>
          <a href="#">G</a>
          <a href="#">in</a>
        </div>
        <span>or use your email for registration</span>
        <input type="text" placeholder="Name" />
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button type="submit">Sign Up</button>
      </form>
    </div>

    <div class="form-container sign-in-container">
      <form action="#">
        <h1>Sign in</h1>
        <div class="social-container">
          <a href="#">f</a>
          <a href="#">G</a>
          <a href="#">in</a>
        </div>
        <span>or use your account</span>
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <a href="#">Forgot your password?</a>
        <button type="submit">Sign In</button>
      </form>
    </div>

    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel">
          <h2>Welcome Back!</h2>
          <p>To keep connected with us please login with your personal info</p>
          <button class="ghost" id="signIn">Sign In</button>
        </div>
        <div class="overlay-panel">
          <h2>Hello, Friend!</h2>
          <p>Enter your personal details and start your journey with us</p>
          <button class="ghost" id="signUp">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <script src="Mini project create a sign in form.js"></script>
</body>
</html>
