<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Exercises</title>
    <style>
        body {
            margin: 0;
            color: #17202a;
            font-family: Georgia, "Times New Roman", serif;
            background: #dcefeb;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 8%;
            color: white;
            background: #087f8c;
            border-bottom: 6px solid #f4c95d;
        }

        nav strong {
            font-size: 1.1rem;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        main {
            width: min(760px, calc(100% - 2rem));
            margin: 2rem auto 4rem;
        }

        section {
            margin: 1rem 0;
            padding: 1.25rem;
            background: #fffdf7;
            border-left: 4px solid #f4c95d;
            box-shadow: 6px 6px 0 rgba(23, 32, 42, 0.1);
        }

        h1 {
            color: #075e68;
            font-size: clamp(2rem, 6vw, 3.5rem);
        }

        h2 {
            margin-top: 0;
            font-size: 1.15rem;
        }

        p {
            margin: 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <nav id="navbar">
        <strong>JavaScript Exercises</strong>
    </nav>

    <main>
        <h1>Functions in action</h1>

        <section>
            <h2>Fortune Teller</h2>
            <p id="fortune"></p>
        </section>

        <section>
            <h2>Juice Bar, Part I</h2>
            <p id="juice-part-one"></p>
        </section>

        <section>
            <h2>Juice Bar, Part II</h2>
            <p id="juice-part-two"></p>
        </section>
    </main>

    <script src="Exercise XP.js"></script>
</body>
</html>
