<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100">
    <div class="max-w-5xl mx-auto px-4 py-10 space-y-10">
        <header class="text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-white">My Media</h1>
            <p class="mt-2 text-slate-400">Listen to audio and watch videos with Tailwind styling.</p>
        </header>

        <section class="space-y-4 rounded-3xl border border-slate-800 bg-slate-900/80 p-6 shadow-2xl shadow-slate-900/40">
            <h2 class="text-2xl font-semibold text-white">Audio (Audiomack embed)</h2>
            <div class="overflow-hidden rounded-3xl border border-slate-800 bg-black">
                <iframe
                    class="w-full h-44"
                    src="https://audiomack.com/embed/song/breeder-lw/unfinished-business-freestyle"
                    frameborder="0"
                    allow="autoplay; clipboard-write; encrypted-media"
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <section class="space-y-4 rounded-3xl border border-slate-800 bg-slate-900/80 p-6 shadow-2xl shadow-slate-900/40">
            <h2 class="text-2xl font-semibold text-white">Video (YouTube embed)</h2>
            <div class="overflow-hidden rounded-3xl border border-slate-800 bg-black">
                <iframe
                    class="w-full aspect-video"
                    src="https://www.youtube.com/embed/78RgP714fxY"
                    title="YouTube video player"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>
        </section>
    </div>
</body>
</html>
