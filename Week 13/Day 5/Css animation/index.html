<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore eight interactive CSS hover animations."
    />
    <link rel="stylesheet" href="style.css" />
    <title>CSS Animation Effects</title>
  </head>
  <body>
    <header class="page-heading">
      <p class="eyebrow">Week 13 · Day 5</p>
      <h1>CSS Animation Playground</h1>
      <p>Hover over a tile or focus it with the keyboard to try each effect.</p>
    </header>

    <div class="effect fade" tabindex="0" aria-label="Fade in effect">
      <span class="effect-number">01</span>
      <span class="effect-name">Fade In</span>
    </div>
    <div class="effect color" tabindex="0" aria-label="Change color effect">
      <span class="effect-number">02</span>
      <span class="effect-name">Change Color</span>
    </div>
    <div class="effect grow-shrink" tabindex="0" aria-label="Grow and shrink effect">
      <span class="effect-number">03</span>
      <span class="effect-name">Grow &amp; Shrink</span>
    </div>
    <div class="effect rotate" tabindex="0" aria-label="Rotate effect">
      <span class="effect-number">04</span>
      <span class="effect-name">Rotate</span>
    </div>
    <div class="effect circle" tabindex="0" aria-label="Square to circle effect">
      <span class="effect-number">05</span>
      <span class="effect-name">Square to Circle</span>
    </div>
    <div class="effect threed" tabindex="0" aria-label="Three-dimensional shadow effect">
      <span class="effect-number">06</span>
      <span class="effect-name">3D Shadow</span>
    </div>
    <div class="effect swing" tabindex="0" aria-label="Swing animation effect">
      <span class="effect-number">07</span>
      <span class="effect-name">Swing</span>
    </div>
    <div class="effect border" tabindex="0" aria-label="Inset border effect">
      <span class="effect-number">08</span>
      <span class="effect-name">Inset Border</span>
    </div>
  </body>
</html>
