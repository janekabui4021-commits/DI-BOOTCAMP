<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Pattern</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="canvas">
      <div class="pattern">
        <span class="square square--left-1"></span>
        <span class="square square--left-2"></span>
        <span class="square square--left-3"></span>
        <span class="square square--left-4"></span>

        <span class="square square--mid-1"></span>
        <span class="square square--mid-2"></span>
        <span class="square square--mid-3"></span>
        <span class="square square--mid-4"></span>

        <span class="square square--right-1"></span>
        <span class="square square--right-2"></span>
        <span class="square square--right-3"></span>
        <span class="square square--right-4"></span>
      </div>
    </main>
  </body>
</html>
